name: read time sync

on:
  workflow_dispatch:
  schedule:
    # 每天北京时间 8:00
    - cron: "0 0 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: Sync Read Time
    runs-on: ubuntu-latest
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_PAGE: ${{ secrets.NOTION_PAGE }}
      WEREAD_API_KEY: ${{ secrets.WEREAD_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Sync read time
        run: python -m weread2notionpro.read_time

      - name: 失败时给出排查指引
        if: failure()
        run: |
          {
            echo "## ❌ 阅读时长同步失败"
            echo ""
            echo "如果是 \`阅读时长数据为空\`，通常是 WEREAD_API_KEY 失效或微信读书接口有变更："
            echo "请到 https://weread.qq.com/r/weread-skills 重新扫码获取 Key 并更新 Secret \`WEREAD_API_KEY\`。"
          } >> "$GITHUB_STEP_SUMMARY"
